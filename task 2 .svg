      stroke="#ff7a00"
      stroke-width="3"
      stroke-linecap="round">

  <animate attributeName="stroke-dasharray"
           values="0 500;500 0"
           dur="3s"
           repeatCount="indefinite"/>

</path>

<circle cx="450" cy="429" r="4" fill="#fff">
  <animate attributeName="cx"
           values="450;735;450"
           dur="3s"
           repeatCount="indefinite"/>
</circle>


<!-- RIGHT SIDE: ANIMATED OBJECT - DATA MODEL -->

<g transform="translate(825 55)">

  <rect x="0" y="0"
