  <text x="38" y="95"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        fill="#ff7a00">
    ROUTES
  </text>

  <rect x="38" y="105"
        width="65"
        height="5"
        rx="2"
        fill="#777"/>

  <rect x="38" y="118"
        width="50"
        height="5"
        rx="2"
        fill="#555"/>

  <rect x="38" y="131"
        width="72"
        height="5"
        rx="2"
        fill="#555"/>


  <!-- DELIVERIES TABLE -->

  <rect x="181" y="75"
        width="105"
        height="68"
        rx="10"
        fill="#242424"
        stroke="#555"/>

  <text x="195" y="95"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        fill="#fff">
    DELIVERIES
  </text>

  <rect x="195" y="105"
        width="65"
        height="5"
        rx="2"
        fill="#777"/>

  <rect x="195" y="118"
        width="50"
        height="5"
        rx="2"
        fill="#555"/>

  <rect x="195" y="131"
        width="72"
        height="5"
        rx="2"
        fill="#555"/>


  <!-- ANIMATED RELATIONSHIP -->

  <path d="M129 109 C150 85 160 135 181 109"
        fill="none"
        stroke="#ff7a00"
        stroke-width="3"
        stroke-dasharray="6 6">

    <animate attributeName="stroke-dashoffset"
             values="0;-24"
