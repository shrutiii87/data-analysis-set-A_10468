             repeatCount="indefinite"/>

  </path>

  <circle cx="155" cy="109"
          r="5"
          fill="#ff7a00">

    <animate attributeName="cx"
             values="130;155;180;155;130"
             dur="2.5s"
             repeatCount="indefinite"/>

    <animate attributeName="cy"
             values="109;92;109;126;109"
             dur="2.5s"
             repeatCount="indefinite"/>

  </circle>


  <!-- SINGLE DIRECTION ARROW -->

  <path d="M137 155 H270"
