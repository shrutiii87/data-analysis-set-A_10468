<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">

  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#000" stroke-opacity=".035"/>
    </pattern>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="500" fill="#fff"/>
  <rect width="1200" height="500" fill="url(#grid)"/>
  <rect width="1200" height="7" fill="url(#orange)"/>

  <!-- LEFT CONTENT -->
  <text x="65" y="58"
        font-family="Arial"
        font-size="12"
        font-weight="700"
        letter-spacing="2"
        fill="#ff7a00">
    TASK THREE • DATA ANALYSIS
  </text>

  <text x="65" y="108"
        font-family="Arial"
        font-size="48"
        font-weight="800"
        fill="#111">
    Python
  </text>

  <text x="65" y="138"
        font-family="Arial"
        font-size="17"
        fill="#555">
    Load • Clean • Merge • Analyze
  </text>

  <!-- WORKFLOW CARD -->
  <g filter="url(#shadow)">
    <rect x="65" y="170" width="500" height="175"
          rx="18" fill="#fff" stroke="#111" stroke-width="1.5"/>
  </g>

  <text x="90" y="200"
        font-family="Arial"
        font-size="12"
        font-weight="700"
        letter-spacing="1.5"
        fill="#111">
    PYTHON DATA WORKFLOW
  </text>

  <!-- workflow nodes -->
  <g font-family="Arial" text-anchor="middle">

    <rect x="90" y="220" width="92" height="58"
          rx="12" fill="#111"/>
    <text x="136" y="244" font-size="12"
          font-weight="700" fill="#fff">LOAD</text>
    <text x="136" y="261" font-size="10"
          fill="#bbb">Pandas</text>

    <rect x="205" y="220" width="92" height="58"
          rx="12" fill="#fff"
          stroke="#ff7a00" stroke-width="2"/>
    <text x="251" y="244" font-size="12"
          font-weight="700" fill="#111">CLEAN</text>
    <text x="251" y="261" font-size="10"
          fill="#666">Duplicates</text>

    <rect x="320" y="220" width="92" height="58"
          rx="12" fill="#ff7a00"/>
    <text x="366" y="244" font-size="12"
          font-weight="700" fill="#111">MERGE</text>
    <text x="366" y="261" font-size="10"
          fill="#222">Left Join</text>

    <rect x="435" y="220" width="92" height="58"
          rx="12" fill="#111"/>
    <text x="481" y="244" font-size="12"
          font-weight="700" fill="#fff">ANALYZE</text>
    <text x="481" y="261" font-size="10"
          fill="#bbb">Groupby</text>

  </g>

  <!-- animated workflow particles -->
  <g fill="#ff7a00">
    <circle cx="190" cy="249" r="4">
      <animate attributeName="cx"
               values="182;205;182"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="305" cy="249" r="4">
      <animate attributeName="cx"
               values="297;320;297"
               dur="1.5s"
               begin=".4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="420" cy="249" r="4">
      <animate attributeName="cx"
               values="412;435;412"
               dur="1.5s"
               begin=".8s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- PYTHON FORMULA STRIP -->
  <rect x="90" y="300" width="450" height="28"
        rx="8" fill="#f4f4f4"/>

  <text x="108" y="319"
        font-family="monospace"
        font-size="11"
        fill="#111">
    delay_days = (actual_days - promised_days).clip(lower=0)
  </text>

  <!-- RIGHT DARK ANALYTICS PANEL -->
  <rect x="600" y="42" width="535" height="416"
        rx="25" fill="#111" filter="url(#shadow)"/>

  <text x="630" y="78"
        font-family="Arial"
        font-size="12"
        font-weight="700"
        letter-spacing="1.8"
        fill="#ff7a00">
    PYTHON ANALYTICS
  </text>

  <text x="630" y="108"
        font-family="Arial"
        font-size="22"
        font-weight="800"
        fill="#fff">
    Delivery Data Engine
  </text>

  <!-- ANIMATED OBJECT: DATAFRAME -->
  <g transform="translate(630 135)">

    <rect x="0" y="0" width="275" height="185"
          rx="14" fill="#fff"/>

    <!-- dataframe header -->
    <rect x="0" y="0" width="275" height="38"
          rx="14" fill="#ff7a00"/>

    <rect x="0" y="25" width="275" height="13"
          fill="#ff7a00"/>

    <!-- grid -->
    <g stroke="#ddd" stroke-width="1">
      <line x1="68" y1="38" x2="68" y2="185"/>
      <line x1="137" y1="38" x2="137" y2="185"/>
      <line x1="206" y1="38" x2="206" y2="185"/>

      <line x1="0" y1="67" x2="275" y2="67"/>
      <line x1="0" y1="96" x2="275" y2="96"/>
      <line x1="0" y1="125" x2="275" y2="125"/>
      <line x1="0" y1="154" x2="275" y2="154"/>
    </g>

    <!-- header labels -->
    <g font-family="Arial"
       font-size="9"
       font-weight="700"
       fill="#111">

      <text x="13" y="24">ROUTE</text>
      <text x="82" y="24">SERVICE</text>
      <text x="150" y="24">DELAY</text>
      <text x="220" y="24">MONTH</text>

    </g>

    <!-- data -->
    <g font-family="Arial"
       font-size="8"
       fill="#666">

      <text x="13" y="57">Route</text>
      <text x="82" y="57">Standard</text>
      <text x="150" y="57">Delay</text>
      <text x="220" y="57">Month</text>

      <text x="13" y="86">Route</text>
      <text x="82" y="86">Express</text>
      <text x="150" y="86">Delay</text>
      <text x="220" y="86">Month</text>

      <text x="13" y="115">Route</text>
      <text x="82" y="115">Standard</text>
      <text x="150" y="115">Delay</text>
      <text x="220" y="115">Month</text>

      <text x="13" y="144">Route</text>
      <text x="82" y="144">Express</text>
      <text x="150" y="144">Delay</text>
      <text x="220" y="144">Month</text>

      <text x="13" y="173">Route</text>
      <text x="82" y="173">Standard</text>
      <text x="150" y="173">Delay</text>
      <text x="220" y="173">Month</text>

    </g>

    <!-- animated dataframe selection -->
    <rect x="69" y="68"
          width="67" height="27"
          fill="none"
          stroke="#ff7a00"
          stroke-width="3">

      <animate attributeName="x"
               values="1;69;138;207;138;69;1"
               dur="4s"
               repeatCount="indefinite"/>

      <animate attributeName="y"
               values="39;68;97;126;155;97;39"
               dur="4s"
               repeatCount="indefinite"/>

    </rect>

  </g>

  <!-- ANIMATED OBJECT: CHART -->
  <g transform="translate(935 135)">

    <rect x="0" y="0" width="165" height="185"
          rx="15" fill="#1c1c1c"
          stroke="#444"/>

    <text x="18" y="25"
          font-family="Arial"
          font-size="10"
          font-weight="700"
          fill="#fff">
      MONTHLY DELAY
    </text>

    <!-- axis -->
    <line x1="25" y1="150"
          x2="140" y2="150"
          stroke="#666"
          stroke-width="2"/>

    <line x1="25" y1="55"
          x2="25" y2="150"
          stroke="#666"
          stroke-width="2"/>

    <!-- bars -->
    <rect x="42" y="110"
          width="18" height="40"
          rx="3" fill="#ff7a00">

      <animate attributeName="height"
               values="25;65;40;55;25"
               dur="2.4s"
               repeatCount="indefinite"/>

      <animate attributeName="y"
               values="125;85;110;95;125"
               dur="2.4s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="75" y="90"
          width="18" height="60"
          rx="3" fill="#fff">

      <animate attributeName="height"
               values="55;30;70;45;55"
               dur="2.7s"
               repeatCount="indefinite"/>

      <animate attributeName="y"
               values="95;120;80;105;95"
               dur="2.7s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="108" y="120"
          width="18" height="30"
          rx="3" fill="#ff7a00">

      <animate attributeName="height"
               values="45;70;25;60;45"
               dur="2.1s"
               repeatCount="indefinite"/>

      <animate attributeName="y"
               values="105;80;125;90;105"
               dur="2.1s"
               repeatCount="indefinite"/>

    </rect>

    <!-- animated chart pulse -->
    <circle cx="117" cy="72"
            r="5"
            fill="#ff7a00">

      <animate attributeName="r"
               values="4;9;4"
               dur="1.5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="1;.3;1"
               dur="1.5s"
               repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- ANOTHER ANIMATED OBJECT: PYTHON TERMINAL -->
  <g transform="translate(630 340)">

    <rect x="0" y="0"
          width="470"
          height="88"
          rx="14"
          fill="#181818"
          stroke="#333"/>

    <!-- terminal header -->
    <circle cx="20" cy="20" r="5" fill="#ff7a00">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="1.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="38" cy="20" r="5" fill="#555"/>
    <circle cx="56" cy="20" r="5" fill="#555"/>

    <!-- code -->
    <text x="20" y="48"
          font-family="monospace"
          font-size="10"
          fill="#ff7a00">
      &gt; pandas.merge(deliveries, routes)
    </text>

    <text x="20" y="67"
          font-family="monospace"
          font-size="10"
          fill="#ddd">
      &gt; clean_data → service_summary → chart
    </text>

    <!-- animated cursor -->
    <rect x="315" y="58"
          width="7"
          height="11"
          fill="#ff7a00">

      <animate attributeName="opacity"
               values="1;0;1"
               dur=".8s"
               repeatCount="indefinite"/>

    </rect>

  </g>

  <!-- FLOATING DATA PARTICLES -->
  <g fill="#ff7a00">

    <circle cx="920" cy="115" r="3">
      <animate attributeName="cy"
               values="115;102;115"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1110" cy="335" r="3">
      <animate attributeName="cy"
               values="335;350;335"
               dur="2.3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="910" cy="325" r="3">
      <animate attributeName="cy"
               values="325;312;325"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- FOOTER -->
  <text x="65" y="420"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        letter-spacing="1.5"
        fill="#777">
    PANDAS • MERGE • GROUPBY • MATPLOTLIB • EXPORT
  </text>

  <rect x="65" y="440"
        width="110"
        height="4"
        rx="2"
        fill="#ff7a00"/>

</svg>
