           repeatCount="indefinite"/>

</rect>


<!-- SERVICE TYPE CHART -->

<rect x="82" y="390"
      width="330"
      height="48"
      rx="10"
      fill="#111"/>

<text x="98" y="407"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#fff">
  TOTAL DELAY BY SERVICE TYPE
</text>

<!-- chart bars -->

<rect x="105" y="423"
      width="35"
      height="10"
      rx="3"
      fill="#ff7a00">

  <animate attributeName="height"
           values="7;24;13;20;7"
           dur="2.2s"
           repeatCount="indefinite"/>

  <animate attributeName="y"
           values="426;409;420;413;426"
           dur="2.2s"
           repeatCount="indefinite"/>

</rect>

<rect x="175" y="416"
      width="35"
      height="17"
      rx="3"
      fill="#fff">

  <animate attributeName="height"
           values="15;28;9;22;15"
           dur="2.5s"
           repeatCount="indefinite"/>

  <animate attributeName="y"
           values="418;405;424;411;418"
           dur="2.5s"
           repeatCount="indefinite"/>

</rect>

<text x="105" y="435"
      font-family="Arial"
      font-size="7"
      fill="#aaa">
  STANDARD
</text>

<text x="175" y="435"
      font-family="Arial"
      font-size="7"
      fill="#aaa">
  EXPRESS
</text>


<!-- MONTHLY TREND -->

<rect x="430" y="390"
      width="337"
      height="48"
      rx="10"
      fill="#111"/>

<text x="447" y="407"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#fff">
  MONTHLY DELAY TREND
</text>

<path d="M450 429
         C475 420 490 425 510 414
         C535 400 550 421 575 409
         C600 397 620 417 645 405
         C675 391 700 412 735 400"
