<text x="635" y="292"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#fff">
  HUB
</text>

<text x="680" y="292"
      font-family="Arial"
      font-size="10"
      fill="#ddd">
  All
</text>

<path d="M745 285 l6 6 l6 -6"
      fill="none"
      stroke="#ff7a00"
      stroke-width="2"/>


<!-- KPI CARD: DELIVERY COUNT -->

<rect x="82" y="323"
      width="205"
      height="55"
      rx="12"
      fill="#f8f8f8"
      stroke="#e4e4e4"/>

<circle cx="110" cy="350"
        r="16"
        fill="#111"/>

<path d="M102 344 L110 340 L118 344 L118 354 L110 359 L102 354 Z"
      fill="none"
      stroke="#ff7a00"
      stroke-width="2"/>

<text x="136" y="345"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#777">
  DELIVERY COUNT
</text>

<rect x="136" y="354"
      width="110"
      height="7"
      rx="4"
      fill="#ff7a00">

  <animate attributeName="width"
           values="70;120;85;110;70"
           dur="2.5s"
           repeatCount="indefinite"/>

</rect>


<!-- KPI CARD: DELAY -->

<rect x="302" y="323"
      width="205"
      height="55"
      rx="12"
      fill="#f8f8f8"
      stroke="#e4e4e4"/>

<circle cx="330" cy="350"
        r="16"
        fill="#ff7a00"/>

<circle cx="330" cy="350"
        r="7"
        fill="none"
        stroke="#111"
        stroke-width="2"/>

<path d="M330 350 L330 345 M330 350 L335 353"
      stroke="#111"
