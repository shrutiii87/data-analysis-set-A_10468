<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">

<defs>

  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#ff7a00"/>
    <stop offset="100%" stop-color="#ffb347"/>
  </linearGradient>

  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#171717"/>
    <stop offset="100%" stop-color="#292929"/>
  </linearGradient>

  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#000" stroke-opacity=".035"/>
  </pattern>

  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".13"/>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200" height="500" fill="#ffffff"/>
<rect width="1200" height="500" fill="url(#grid)"/>

<rect width="1200" height="7" fill="url(#orange)"/>


<!-- LEFT HEADER -->

<text x="60" y="58"
      font-family="Arial"
      font-size="12"
      font-weight="700"
      letter-spacing="2"
      fill="#ff7a00">
  POWER BI • DATA ANALYTICS
</text>

<text x="60" y="108"
      font-family="Arial"
      font-size="46"
      font-weight="800"
      fill="#111">
  Power BI
</text>

<text x="60" y="137"
      font-family="Arial"
      font-size="17"
      fill="#555">
  Model • Measure • Visualize • Filter
</text>


<!-- WORKFLOW -->

<g transform="translate(60 170)">

  <!-- Data Import -->

  <rect x="0" y="0" width="105" height="65"
        rx="13" fill="#111"/>

  <text x="52" y="27"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        fill="#fff">
    DATA IMPORT
  </text>

  <text x="52" y="46"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        fill="#aaa">
    CSV sources
  </text>


  <!-- Arrow -->

  <path d="M112 32 H135"
        stroke="#ff7a00"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="112" cy="32" r="4" fill="#ff7a00">
    <animate attributeName="cx"
             values="112;135;112"
             dur="1.6s"
             repeatCount="indefinite"/>
  </circle>


  <!-- Power Query -->

  <rect x="142" y="0" width="105" height="65"
        rx="13"
        fill="#fff"
        stroke="#ff7a00"
        stroke-width="2"/>

  <text x="194" y="27"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        fill="#111">
    POWER QUERY
  </text>

  <text x="194" y="46"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        fill="#777">
    Clean data
  </text>


  <!-- Arrow -->

  <path d="M254 32 H277"
        stroke="#ff7a00"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="254" cy="32" r="4" fill="#ff7a00">
    <animate attributeName="cx"
             values="254;277;254"
             dur="1.6s"
             begin=".4s"
             repeatCount="indefinite"/>
  </circle>


  <!-- Data Model -->

  <rect x="284" y="0" width="105" height="65"
        rx="13"
        fill="#ff7a00"/>

  <text x="336" y="27"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        fill="#111">
    DATA MODEL
  </text>

  <text x="336" y="46"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        fill="#222">
    Relationships
  </text>


  <!-- Arrow -->

  <path d="M396 32 H419"
        stroke="#ff7a00"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="396" cy="32" r="4" fill="#ff7a00">
    <animate attributeName="cx"
             values="396;419;396"
             dur="1.6s"
             begin=".8s"
             repeatCount="indefinite"/>
  </circle>


  <!-- Visuals -->

  <rect x="426" y="0" width="105" height="65"
        rx="13"
        fill="#111"/>

  <text x="478" y="27"
        text-anchor="middle"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        fill="#fff">
    VISUALS
  </text>

  <text x="478" y="46"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        fill="#aaa">
    Dashboard
  </text>

</g>


<!-- MAIN DASHBOARD PANEL -->

<g filter="url(#shadow)">

  <rect x="60" y="265"
        width="730"
        height="185"
        rx="20"
        fill="#fff"
        stroke="#111"
        stroke-width="1.5"/>

</g>


<!-- DASHBOARD HEADER -->

<rect x="60" y="265"
      width="730"
      height="43"
      rx="20"
      fill="#111"/>

<rect x="60" y="288"
      width="730"
      height="20"
      fill="#111"/>

<text x="85" y="292"
      font-family="Arial"
      font-size="15"
      font-weight="800"
      fill="#fff">
  DELIVERY PERFORMANCE DASHBOARD
</text>


<!-- HUB SLICER -->

<rect x="620" y="274"
