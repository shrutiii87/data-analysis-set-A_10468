      height="7"
      rx="4"
      fill="#111">

  <animate attributeName="width"
           values="60;105;80;120;60"
           dur="2.2s"
           repeatCount="indefinite"/>

</rect>


<!-- KPI CARD: INCIDENCE -->

<rect x="522" y="323"
      width="245"
      height="55"
      rx="12"
      fill="#f8f8f8"
      stroke="#e4e4e4"/>

<circle cx="550" cy="350"
        r="16"
        fill="#111"/>

<text x="550" y="356"
      text-anchor="middle"
      font-family="Arial"
      font-size="16"
      font-weight="800"
      fill="#ff7a00">
  %
</text>

<text x="576" y="345"
      font-family="Arial"
      font-size="10"
      font-weight="700"
      fill="#777">
  DELAY INCIDENCE RATE
</text>

<rect x="576" y="354"
