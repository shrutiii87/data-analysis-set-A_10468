<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>

    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2A2A2A" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111111" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <path id="orbit1" d="M820 235 C885 150 1015 155 1080 235 C1015 315 885 320 820 235Z" fill="none"/>
    <path id="orbit2" d="M885 125 C975 95 1080 160 1080 250 C1080 340 975 405 885 375 C825 355 805 290 825 235 C805 180 825 145 885 125Z" fill="none"/>

    <style>
      .title { font: 700 39px Arial, Helvetica, sans-serif; fill:#111111; }
      .subtitle { font: 500 17px Arial, Helvetica, sans-serif; fill:#555555; }
      .eyebrow { font: 700 13px Arial, Helvetica, sans-serif; letter-spacing:2.5px; fill:#FF6A00; }
      .body { font: 400 15px Arial, Helvetica, sans-serif; fill:#444444; }
      .small { font: 600 11px Arial, Helvetica, sans-serif; letter-spacing:1.4px; fill:#777777; }
      .formula { font: 700 20px Arial, Helvetica, sans-serif; fill:#111111; }
      .label { font: 600 12px Arial, Helvetica, sans-serif; fill:#333333; }
    </style>
  </defs>

  <!-- WHITE / BLACK / ORANGE CANVAS -->
  <rect x="0" y="0" width="1200" height="500" rx="28" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="500" rx="28" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="500" rx="28" fill="none" stroke="#111111" stroke-width="2"/>

  <!-- TOP ACCENT -->
  <rect x="45" y="38" width="72" height="5" rx="2.5" fill="url(#orangeGrad)">
    <animate attributeName="width" values="72;115;72" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- LEFT CONTENT -->
  <text x="45" y="78" class="eyebrow">PART E  /  SUPERVISED LEARNING</text>
  <text x="45" y="125" class="title">Multiple Linear Regression</text>
  <text x="45" y="155" class="subtitle">Multiple features → one prediction</text>

  <text x="45" y="198" class="body">A target is predicted using several</text>
  <text x="45" y="221" class="body">independent variables simultaneously.</text>

  <!-- FORMULA CARD -->
  <rect x="45" y="255" width="490" height="92" rx="18" fill="#FFFFFF" stroke="#111111" stroke-width="2" filter="url(#shadow)"/>
  <rect x="45" y="255" width="7" height="92" rx="3.5" fill="url(#orangeGrad)"/>
  <text x="72" y="282" class="small">MULTI-FEATURE MODEL</text>
  <text x="72" y="316" class="formula">ŷ = b₀ + b₁x₁ + b₂x₂ + b₃x₃</text>
  <text x="72" y="337" class="body" font-size="12">Each coefficient controls the contribution of a feature.</text>

  <!-- PIPELINE -->
  <g transform="translate(45,382)">
    <text x="0" y="0" class="small">FEATURES</text>
    <text x="136" y="0" class="small">WEIGHTS</text>
    <text x="275" y="0" class="small">MODEL</text>
    <text x="410" y="0" class="small">OUTPUT</text>

    <g transform="translate(5,18)">
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" stroke="#FF6A00" stroke-width="3"/>
      <circle cx="0" cy="28" r="6" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
      <circle cx="0" cy="56" r="6" fill="#FFFFFF" stroke="#FF6A00" stroke-width="3"/>

      <path d="M7 0 C45 -5 70 -2 120 14" fill="none" stroke="#111111" stroke-width="2"/>
      <path d="M7 28 C55 25 78 22 120 14" fill="none" stroke="#FF6A00" stroke-width="2"/>
      <path d="M7 56 C48 58 82 42 120 14" fill="none" stroke="#111111" stroke-width="2"/>

      <circle cx="128" cy="14" r="9" fill="#FF6A00">
        <animate attributeName="r" values="7;11;7" dur="1.7s" repeatCount="indefinite"/>
      </circle>

      <path d="M138 14 H245" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="258" cy="14" r="22" fill="#111111"/>
      <text x="258" y="10" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF">MODEL</text>
      <text x="258" y="21" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFFFFF">FIT</text>

      <path d="M281 14 H390" fill="none" stroke="#111111" stroke-width="2"/>
      <circle cx="403" cy="14" r="10" fill="#FFFFFF" stroke="#FF6A00" stroke-width="4">
        <animate attributeName="stroke-width" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="418" y="18" class="label">ŷ prediction</text>
    </g>
  </g>

  <!-- RIGHT ANIMATED OBJECT PANEL -->
  <rect x="585" y="38" width="570" height="424" rx="26" fill="#111111" filter="url(#shadow)"/>
  <rect x="585" y="38" width="570" height="424" rx="26" fill="none" stroke="#FF6A00" stroke-width="2"/>

  <text x="620" y="76" class="eyebrow" fill="#FF8A00">REGRESSION ENGINE</text>
  <text x="620" y="108" font-family="Arial" font-size="25" font-weight="700" fill="#FFFFFF">Feature → Coefficient → Prediction</text>
  <text x="620" y="133" font-family="Arial" font-size="13" fill="#BDBDBD">Animated model response surface</text>

  <!-- coefficient chips -->
  <g transform="translate(620,160)">
    <rect x="0" y="0" width="126" height="42" rx="12" fill="#FFFFFF"/>
    <text x="63" y="17" text-anchor="middle" class="small">b₁</text>
    <text x="63" y="33" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">+0.62</text>

    <rect x="138" y="0" width="126" height="42" rx="12" fill="#FFFFFF"/>
    <text x="201" y="17" text-anchor="middle" class="small">b₂</text>
    <text x="201" y="33" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#111111">+0.31</text>

    <rect x="276" y="0" width="126" height="42" rx="12" fill="#FF6A00"/>
    <text x="339" y="17" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#FFFFFF">b₃</text>
    <text x="339" y="33" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF">−0.18</text>
  </g>

  <!-- ANIMATED REGRESSION SURFACE -->
  <g transform="translate(610,210)">
    <!-- plane -->
    <polygon points="50,110 360,35 500,105 185,190" fill="url(#planeGrad)" stroke="#FF6A00" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 275 112;1.5 275 112;0 275 112;-1.5 275 112;0 275 112" dur="5s" repeatCount="indefinite"/>
    </polygon>

    <!-- grid lines on plane -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2">
      <path d="M86 119 L395 46"/>
      <path d="M121 140 L430 66"/>
      <path d="M156 160 L465 87"/>
      <path d="M88 101 L220 177"/>
      <path d="M150 86 L282 162"/>
      <path d="M212 70 L344 145"/>
      <path d="M274 55 L406 130"/>
    </g>

    <!-- regression line -->
    <path d="M74 143 C175 112 255 115 370 82 C418 68 450 72 485 88"
          fill="none" stroke="#FF6A00" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-44" dur="1.2s" repeatCount="indefinite"/>
    </path>

    <!-- floating observations -->
    <g filter="url(#glow)">
      <circle cx="126" cy="104" r="6" fill="#FFFFFF">
        <animate attributeName="cy" values="104;92;104" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="218" cy="126" r="6" fill="#FF6A00">
        <animate attributeName="cy" values="126;114;126" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="315" cy="83" r="6" fill="#FFFFFF">
        <animate attributeName="cy" values="83;70;83" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="409" cy="96" r="6" fill="#FF6A00">
        <animate attributeName="cy" values="96;82;96" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- moving prediction particle -->
    <circle r="7" fill="#FF6A00" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#orbit1"/>
      </animateMotion>
    </circle>

    <!-- orbit rings -->
    <ellipse cx="275" cy="112" rx="225" ry="105" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>
    <ellipse cx="275" cy="112" rx="165" ry="72" fill="none" stroke="#FF6A00" stroke-opacity="0.25" stroke-width="1.5"
             transform="rotate(-18 275 112)"/>

    <!-- central model core -->
    <circle cx="275" cy="112" r="28" fill="#FFFFFF" stroke="#FF6A00" stroke-width="4" filter="url(#glow)">
      <animate attributeName="r" values="25;31;25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="275" y="108" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#111111">MLR</text>
    <text x="275" y="120" text-anchor="middle" font-family="Arial" font-size="8" fill="#555555">MODEL</text>
  </g>

  <!-- OUTPUT BADGE -->
  <g transform="translate(930,395)">
    <rect x="0" y="0" width="185" height="43" rx="13" fill="#FF6A00"/>
    <text x="92" y="17" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">PREDICTED OUTPUT</text>
    <text x="92" y="34" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#FFFFFF">ŷ = 48.4M</text>
    <animateTransform attributeName="transform" type="translate"
      values="930 395;930 389;930 395" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- footer -->
  <text x="620" y="438" font-family="Arial" font-size="10" font-weight="600" letter-spacing="1.4px" fill="#777777">
    FEATURES  •  COEFFICIENTS  •  FITTED SURFACE  •  PREDICTION
  </text>
</svg>
