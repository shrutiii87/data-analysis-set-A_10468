<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>

    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#292929"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12"
                    flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#111111"
            stroke-opacity="0.055"/>
    </pattern>

    <!-- Animated truck path -->
    <path id="truckRoute"
          d="M680 325
             C735 270 770 365 825 305
             C880 245 920 340 980 280
             C1025 235 1060 250 1090 220"
          fill="none"/>

    <style>
      .title {
        font:700 39px Arial, Helvetica, sans-serif;
        fill:#111111;
      }

      .subtitle {
        font:500 17px Arial, Helvetica, sans-serif;
        fill:#555555;
      }

      .eyebrow {
        font:700 13px Arial, Helvetica, sans-serif;
        letter-spacing:2.5px;
        fill:#FF6A00;
      }

      .body {
        font:400 15px Arial, Helvetica, sans-serif;
        fill:#444444;
      }

      .small {
        font:600 11px Arial, Helvetica, sans-serif;
        letter-spacing:1.4px;
        fill:#777777;
      }
    </style>

  </defs>


  <!-- BACKGROUND -->

  <rect width="1200"
        height="500"
        rx="28"
        fill="#FFFFFF"/>

  <rect width="1200"
        height="500"
        rx="28"
        fill="url(#grid)"/>

  <rect x="1"
        y="1"
        width="1198"
        height="498"
        rx="28"
        fill="none"
        stroke="#111111"
        stroke-width="2"/>


  <!-- TOP ORANGE ACCENT -->

  <rect x="45"
        y="38"
        width="75"
        height="5"
        rx="3"
        fill="url(#orangeGrad)">

    <animate attributeName="width"
             values="75;125;75"
             dur="2.4s"
             repeatCount="indefinite"/>

  </rect>


  <!-- LEFT CONTENT -->

  <text x="45"
        y="78"
        class="eyebrow">
    LOGISTICS / DATA ANALYTICS
  </text>

  <text x="45"
        y="125"
        class="title">
    Delivery Delay Analysis
  </text>

  <text x="45"
        y="157"
        class="subtitle">
    Excel  •  Power BI  •  SQL  •  Python
  </text>


  <text x="45"
        y="200"
        class="body">
    Analyze delivery performance,
  </text>

  <text x="45"
        y="223"
        class="body">
    identify delay patterns and improve operations.
  </text>


  <!-- ANALYTICS CARD -->

  <rect x="45"
        y="255"
        width="490"
        height="105"
        rx="18"
        fill="#FFFFFF"
        stroke="#111111"
        stroke-width="2"
        filter="url(#shadow)"/>

  <rect x="45"
        y="255"
        width="7"
        height="105"
        rx="3"
        fill="url(#orangeGrad)"/>


  <text x="72"
        y="283"
        class="small">
    DELIVERY PERFORMANCE
  </text>

  <text x="72"
        y="319"
        font-family="Arial"
        font-size="21"
        font-weight="700"
        fill="#111111">
    Planned → Shipped → Delivered
  </text>

  <text x="72"
        y="343"
        class="body">
    Track the journey and detect delivery delays.
  </text>


  <!-- ANIMATED SIGNAL -->

  <g transform="translate(445 307)">

    <circle cx="0"
            cy="0"
            r="12"
            fill="#FF6A00">

      <animate attributeName="r"
               values="8;15;8"
               dur="1.6s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="1;0.45;1"
               dur="1.6s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="0"
            cy="0"
            r="25"
            fill="none"
            stroke="#FF6A00"
            stroke-width="2"
            opacity="0.35">

      <animate attributeName="r"
               values="18;34;18"
               dur="1.6s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0.5;0;0.5"
               dur="1.6s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- DATA PIPELINE -->

  <g transform="translate(45 405)">

    <text x="0" y="0" class="small">DATA</text>
    <text x="135" y="0" class="small">CLEAN</text>
    <text x="270" y="0" class="small">ANALYZE</text>
    <text x="410" y="0" class="small">INSIGHT</text>


    <circle cx="10"
            cy="25"
            r="7"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="3"/>

    <path d="M20 25 H115"
          stroke="#111111"
          stroke-width="2"/>


    <circle cx="125"
            cy="25"
            r="9"
            fill="#FF6A00">

      <animate attributeName="r"
               values="7;11;7"
               dur="1.5s"
               repeatCount="indefinite"/>

    </circle>

    <path d="M135 25 H250"
          stroke="#111111"
          stroke-width="2"/>


    <circle cx="260"
            cy="25"
            r="20"
            fill="#111111"/>

    <path d="M251 25 L258 32 L270 18"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="3"/>


    <path d="M282 25 H395"
          stroke="#111111"
          stroke-width="2"/>


    <circle cx="407"
            cy="25"
            r="10"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="4">

      <animate attributeName="stroke-width"
               values="3;6;3"
               dur="1.7s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- RIGHT DARK PANEL -->

  <rect x="585"
        y="38"
        width="570"
        height="424"
        rx="26"
        fill="#111111"
        filter="url(#shadow)"/>

  <rect x="585"
        y="38"
        width="570"
        height="424"
        rx="26"
        fill="none"
        stroke="#FF6A00"
        stroke-width="2"/>


  <text x="620"
        y="76"
        class="eyebrow">
    DELIVERY MONITOR
  </text>

  <text x="620"
        y="108"
        font-family="Arial"
        font-size="25"
        font-weight="700"
        fill="#FFFFFF">
    Shipment → Route → Delivery
  </text>

  <text x="620"
        y="133"
        font-family="Arial"
        font-size="13"
        fill="#BDBDBD">
    Animated delivery tracking
  </text>


  <!-- ROUTE -->

  <path d="M665 325
           C735 270 770 365 825 305
           C880 245 920 340 980 280
           C1025 235 1060 250 1090 220"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.10"
        stroke-width="9"/>


  <path d="M665 325
           C735 270 770 365 825 305
           C880 245 920 340 980 280
           C1025 235 1060 250 1090 220"
        fill="none"
        stroke="#FF6A00"
        stroke-width="3"
        stroke-dasharray="9 8">

    <animate attributeName="stroke-dashoffset"
             from="0"
             to="-51"
             dur="1.2s"
             repeatCount="indefinite"/>

  </path>


  <!-- ROUTE POINTS -->

  <circle cx="665"
          cy="325"
          r="9"
          fill="#FFFFFF"
          stroke="#FF6A00"
          stroke-width="4"/>

  <circle cx="825"
          cy="305"
          r="9"
          fill="#111111"
          stroke="#FFFFFF"
          stroke-width="3"/>

  <circle cx="980"
          cy="280"
          r="9"
          fill="#FF6A00"
          stroke="#FFFFFF"
          stroke-width="3"/>

  <circle cx="1090"
          cy="220"
          r="11"
          fill="#FFFFFF"
          stroke="#FF6A00"
          stroke-width="4">

    <animate attributeName="r"
             values="9;15;9"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>


  <!-- LABELS -->

  <text x="640"
        y="355"
        font-family="Arial"
        font-size="10"
        fill="#AAAAAA">
    WAREHOUSE
  </text>

  <text x="800"
        y="335"
        font-family="Arial"
        font-size="10"
        fill="#AAAAAA">
    HUB
  </text>

  <text x="960"
        y="310"
        font-family="Arial"
        font-size="10"
        fill="#AAAAAA">
    CITY
  </text>

  <text x="1050"
        y="200"
        font-family="Arial"
        font-size="10"
        font-weight="700"
        fill="#FF6A00">
    CUSTOMER
  </text>


  <!-- ================================================= -->
  <!-- ANIMATED DELIVERY TRUCK -->
  <!-- ================================================= -->

  <g filter="url(#glow)">

    <g>

      <!-- Truck body -->

      <rect x="-30"
            y="-18"
            width="55"
            height="27"
            rx="4"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="2"/>


      <!-- Cabin -->

      <path d="M25 -18
               H42
               L54 -5
               V9
               H25 Z"
            fill="#FF6A00"
            stroke="#FFFFFF"
            stroke-width="2"/>


      <!-- Window -->

      <path d="M32 -14
               H40
               L48 -5
               H32 Z"
            fill="#111111"/>


      <!-- Wheels -->

      <circle cx="-13"
              cy="12"
              r="7"
              fill="#111111"
              stroke="#FFFFFF"
              stroke-width="2"/>

      <circle cx="38"
              cy="12"
              r="7"
              fill="#111111"
              stroke="#FFFFFF"
              stroke-width="2"/>


      <!-- Package -->

      <rect x="-19"
            y="-12"
            width="18"
            height="16"
            rx="2"
            fill="#FF6A00"/>

      <path d="M-10 -12 V4 M-19 -4 H-1"
            stroke="#FFFFFF"
            stroke-width="1.5"/>


      <!-- Truck animation -->

      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        rotate="auto">

        <mpath href="#truckRoute"/>

      </animateMotion>

    </g>

  </g>


  <!-- MOVING ANALYTICS PARTICLES -->

  <circle r="5"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animateMotion dur="3s"
                   repeatCount="indefinite">

      <mpath href="#truckRoute"/>

    </animateMotion>

  </circle>


  <circle r="4"
          fill="#FF6A00"
          filter="url(#glow)">

    <animateMotion dur="3s"
                   begin="1.5s"
                   repeatCount="indefinite">

      <mpath href="#truckRoute"/>

    </animateMotion>

  </circle>


  <!-- ANIMATED DELAY INDICATOR -->

  <g transform="translate(915 390)">

    <rect width="195"
          height="42"
          rx="12"
          fill="#FF6A00">

      <animate attributeName="opacity"
               values="1;0.65;1"
               dur="2s"
               repeatCount="indefinite"/>

    </rect>

    <text x="97"
          y="26"
          text-anchor="middle"
          font-family="Arial"
          font-size="11"
          font-weight="700"
          letter-spacing="1"
          fill="#FFFFFF">
      DELIVERY DELAY DETECTED
    </text>

  </g>


  <!-- FOOTER -->

  <text x="620"
        y="440"
        font-family="Arial"
        font-size="10"
        font-weight="600"
        letter-spacing="1.4px"
        fill="#777777">

    EXCEL  •  POWER BI  •  SQL  •  PYTHON

  </text>

</svg>
