<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5A00"/>
    </linearGradient>

    <!-- Dark Gradient -->
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#292929"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity="0.18"/>
    </filter>

    <!-- Glow -->
    <filter id="glow"
            x="-80%"
            y="-80%"
            width="260%"
            height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Grid -->
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">

      <path d="M32 0H0V32"
            fill="none"
            stroke="#111111"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Truck Route -->
    <path id="truckRoute"
          d="M665 330
             C720 260 770 375 825 300
             C880 225 925 345 990 270
             C1025 230 1060 245 1090 225"
          fill="none"/>

    <style>

      .title {
        font: 700 39px Arial, Helvetica, sans-serif;
        fill:#111111;
      }

      .subtitle {
        font: 500 17px Arial, Helvetica, sans-serif;
        fill:#555555;
      }

      .eyebrow {
        font: 700 13px Arial, Helvetica, sans-serif;
        letter-spacing:2.5px;
        fill:#FF6A00;
      }

      .body {
        font: 400 15px Arial, Helvetica, sans-serif;
        fill:#444444;
      }

      .small {
        font: 600 11px Arial, Helvetica, sans-serif;
        letter-spacing:1.4px;
        fill:#777777;
      }

      .label {
        font: 600 12px Arial, Helvetica, sans-serif;
        fill:#333333;
      }

    </style>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect x="0"
        y="0"
        width="1200"
        height="500"
        rx="28"
        fill="#FFFFFF"/>

  <rect x="0"
        y="0"
        width="1200"
        height="500"
        rx="28"
        fill="url(#grid)"/>

  <rect x="0"
        y="0"
        width="1200"
        height="500"
        rx="28"
        fill="none"
        stroke="#111111"
        stroke-width="2"/>


  <!-- ================================================= -->
  <!-- TOP ACCENT -->
  <!-- ================================================= -->

  <rect x="45"
        y="38"
        width="72"
        height="5"
        rx="2.5"
        fill="url(#orangeGrad)">

    <animate
      attributeName="width"
      values="72;125;72"
      dur="2.4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ================================================= -->

  <text x="45"
        y="78"
        class="eyebrow">

    LOGISTICS / DATA ANALYTICS

  </text>


  <text x="45"
        y="125"
        class="title">

    Delivery Delay Analysis

  </text>


  <text x="45"
        y="155"
        class="subtitle">

    Excel  •  Power BI  •  SQL  •  Python

  </text>


  <text x="45"
        y="198"
        class="body">

    Analyze delivery performance, identify

  </text>

  <text x="45"
        y="221"
        class="body">

    delay patterns and improve operations.

  </text>


  <!-- ================================================= -->
  <!-- ANALYTICS CARD -->
  <!-- ================================================= -->

  <rect x="45"
        y="255"
        width="490"
        height="105"
        rx="18"
        fill="#FFFFFF"
        stroke="#111111"
        stroke-width="2"
        filter="url(#shadow)"/>


  <!-- Orange Accent -->

  <rect x="45"
        y="255"
        width="7"
        height="105"
        rx="3.5"
        fill="url(#orangeGrad)"/>


  <text x="72"
        y="283"
        class="small">

    DELIVERY PERFORMANCE

  </text>


  <text x="72"
        y="318"
        font-family="Arial"
        font-size="20"
        font-weight="700"
        fill="#111111">

    Delay Rate

  </text>


  <text x="72"
        y="342"
        font-family="Arial"
        font-size="15"
        fill="#555555">

    Planned → Shipped → Delivered

  </text>


  <!-- Animated percentage -->

  <g transform="translate(420 276)">

    <circle cx="45"
            cy="35"
            r="31"
            fill="#111111"/>

    <circle cx="45"
            cy="35"
            r="31"
            fill="none"
            stroke="#FF6A00"
            stroke-width="5"
            stroke-dasharray="55 145"
            stroke-linecap="round">

      <animate
        attributeName="stroke-dashoffset"
        values="0;-200;0"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>

    <text x="45"
          y="40"
          text-anchor="middle"
          font-family="Arial"
          font-size="15"
          font-weight="700"
          fill="#FFFFFF">

      24%

    </text>

  </g>


  <!-- ================================================= -->
  <!-- PIPELINE -->
  <!-- ================================================= -->

  <g transform="translate(45,397)">

    <text x="0"
          y="0"
          class="small">

      DATA

    </text>

    <text x="130"
          y="0"
          class="small">

      CLEAN

    </text>

    <text x="260"
          y="0"
          class="small">

      ANALYZE

    </text>

    <text x="405"
          y="0"
          class="small">

      INSIGHT

    </text>


    <!-- DATA -->

    <circle cx="10"
            cy="25"
            r="7"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="3"/>


    <path d="M20 25 H115"
          stroke="#111111"
          stroke-width="2"/>


    <!-- CLEAN -->

    <circle cx="125"
            cy="25"
            r="9"
            fill="#FF6A00">

      <animate
        attributeName="r"
        values="7;11;7"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <path d="M135 25 H245"
          stroke="#111111"
          stroke-width="2"/>


    <!-- ANALYZE -->

    <circle cx="255"
            cy="25"
            r="21"
            fill="#111111"/>

    <text x="255"
          y="29"
          text-anchor="middle"
          font-family="Arial"
          font-size="9"
          font-weight="700"
          fill="#FFFFFF">

      SQL

    </text>


    <path d="M277 25 H390"
          stroke="#111111"
          stroke-width="2"/>


    <!-- INSIGHT -->

    <circle cx="402"
            cy="25"
            r="10"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="4">

      <animate
        attributeName="stroke-width"
        values="3;6;3"
        dur="1.7s"
        repeatCount="indefinite"/>

    </circle>

  </g>



  <!-- ================================================= -->
  <!-- RIGHT ANALYTICS PANEL -->
  <!-- ================================================= -->

  <rect x="585"
        y="38"
        width="570"
        height="424"
        rx="26"
        fill="#111111"
        filter="url(#shadow)"/>


  <rect x="585"
        y="38"
        width="570"
        height="424"
        rx="26"
        fill="none"
        stroke="#FF6A00"
        stroke-width="2"/>


  <text x="620"
        y="76"
        class="eyebrow">

    LIVE DELIVERY MONITOR

  </text>


  <text x="620"
        y="108"
        font-family="Arial"
        font-size="25"
        font-weight="700"
        fill="#FFFFFF">

    Shipment → Route → Delivery

  </text>


  <text x="620"
        y="133"
        font-family="Arial"
        font-size="13"
        fill="#BDBDBD">

    Animated delay detection

  </text>



  <!-- ================================================= -->
  <!-- KPI CARDS -->
  <!-- ================================================= -->

  <g transform="translate(620 158)">

    <!-- Card 1 -->

    <rect x="0"
          y="0"
          width="125"
          height="48"
          rx="12"
          fill="#FFFFFF"/>

    <text x="62"
          y="18"
          text-anchor="middle"
          class="small">

      ORDERS

    </text>

    <text x="62"
          y="37"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="700"
          fill="#111111">

      4,280

    </text>


    <!-- Card 2 -->

    <rect x="138"
          y="0"
          width="125"
          height="48"
          rx="12"
          fill="#FFFFFF"/>

    <text x="200"
          y="18"
          text-anchor="middle"
          class="small">

      ON TIME

    </text>

    <text x="200"
          y="37"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="700"
          fill="#111111">

      76%

    </text>


    <!-- Card 3 -->

    <rect x="276"
          y="0"
          width="125"
          height="48"
          rx="12"
          fill="#FF6A00"/>

    <text x="338"
          y="18"
          text-anchor="middle"
          font-family="Arial"
          font-size="10"
          font-weight="700"
          fill="#FFFFFF">

      DELAYED

    </text>

    <text x="338"
          y="37"
          text-anchor="middle"
          font-family="Arial"
          font-size="14"
          font-weight="700"
          fill="#FFFFFF">

      24%

    </text>

  </g>



  <!-- ================================================= -->
  <!-- ROUTE AREA -->
  <!-- ================================================= -->

  <g transform="translate(0 0)">


    <!-- Route shadow -->

    <path d="M665 330
             C720 260 770 375 825 300
             C880 225 925 345 990 270
             C1025 230 1060 245 1090 225"

          fill="none"
          stroke="#FFFFFF"
          stroke-opacity="0.10"
          stroke-width="9"/>


    <!-- Main route -->

    <path d="M665 330
             C720 260 770 375 825 300
             C880 225 925 345 990 270
             C1025 230 1060 245 1090 225"

          fill="none"
          stroke="#FF6A00"
          stroke-width="3"
          stroke-dasharray="9 8">

      <animate
        attributeName="stroke-dashoffset"
        from="0"
        to="-51"
        dur="1.2s"
        repeatCount="indefinite"/>

    </path>


    <!-- Location 1 -->

    <circle cx="665"
            cy="330"
            r="9"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="4"/>


    <!-- Location 2 -->

    <circle cx="825"
            cy="300"
            r="9"
            fill="#111111"
            stroke="#FFFFFF"
            stroke-width="3"/>


    <!-- Location 3 -->

    <circle cx="990"
            cy="270"
            r="9"
            fill="#FF6A00"
            stroke="#FFFFFF"
            stroke-width="3"/>


    <!-- Destination -->

    <circle cx="1090"
            cy="225"
            r="12"
            fill="#FFFFFF"
            stroke="#FF6A00"
            stroke-width="4">

      <animate
        attributeName="r"
        values="10;15;10"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>


    <!-- Location labels -->

    <text x="650"
          y="360"
          font-family="Arial"
          font-size="10"
          fill="#AAAAAA">

      WAREHOUSE

    </text>


    <text x="805"
          y="330"
          font-family="Arial"
          font-size="10"
          fill="#AAAAAA">

      HUB

    </text>


    <text x="972"
          y="300"
          font-family="Arial"
          font-size="10"
          fill="#AAAAAA">

      CITY

    </text>


    <text x="1055"
          y="205"
          font-family="Arial"
          font-size="10"
          font-weight="700"
          fill="#FF6A00">

      CUSTOMER

    </text>



    <!-- ================================================= -->
    <!-- ANIMATED DELIVERY TRUCK -->
    <!-- ================================================= -->

    <g filter="url(#glow)">

      <g>

        <!-- Truck body -->

        <rect x="-30"
              y="-18"
              width="55"
              height="27"
              rx="4"
              fill="#FFFFFF"
              stroke="#FF6A00"
              stroke-width="2"/>


        <!-- Truck cabin -->

        <path d="M25 -18
                 H42
                 L54 -5
                 V9
                 H25 Z"

              fill="#FF6A00"
              stroke="#FFFFFF"
              stroke-width="2"/>


        <!-- Window -->

        <path d="M32 -14
                 H40
                 L48 -5
                 H32 Z"

              fill="#111111"/>


        <!-- Wheels -->

        <circle cx="-13"
                cy="12"
                r="7"
                fill="#111111"
                stroke="#FFFFFF"
                stroke-width="2"/>

        <circle cx="38"
                cy="12"
                r="7"
                fill="#111111"
                stroke="#FFFFFF"
                stroke-width="2"/>


        <!-- Wheel centers -->

        <circle cx="-13"
                cy="12"
                r="2"
                fill="#FFFFFF"/>

        <circle cx="38"
                cy="12"
                r="2"
                fill="#FFFFFF"/>


        <!-- Delivery box -->

        <rect x="-19"
              y="-12"
              width="18"
              height="16"
              rx="2"
              fill="#FF6A00"/>


        <!-- Box cross -->

        <path d="M-10 -12 V4 M-19 -4 H-1"
              stroke="#FFFFFF"
              stroke-width="1.5"/>


        <!-- Move truck along route -->

        <animateMotion
          dur="5s"
          repeatCount="indefinite"
          rotate="auto">

          <mpath href="#truckRoute"/>

        </animateMotion>

      </g>

    </g>


  </g>



  <!-- ================================================= -->
  <!-- DELAY ALERT -->
  <!-- ================================================= -->

  <g transform="translate(930 365)">

    <rect x="0"
          y="0"
          width="185"
          height="48"
          rx="13"
          fill="#FF6A00">

      <animate
        attributeName="opacity"
        values="1;0.72;1"
        dur="2s"
        repeatCount="indefinite"/>

    </rect>


    <text x="92"
          y="18"
          text-anchor="middle"
          font-family="Arial"
          font-size="10"
          font-weight="700"
          letter-spacing="1.2"
          fill="#FFFFFF">

      DELAY ALERT

    </text>


    <text x="92"
          y="36"
          text-anchor="middle"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#FFFFFF">

      +2.4 DAYS

    </text>

  </g>



  <!-- ================================================= -->
  <!-- FOOTER -->
  <!-- ================================================= -->

  <text x="620"
        y="440"
        font-family="Arial"
        font-size="10"
        font-weight="600"
        letter-spacing="1.4px"
        fill="#777777">

    EXCEL  •  POWER BI  •  SQL  •  PYTHON  •  DELIVERY INSIGHTS

  </text>

</svg>
