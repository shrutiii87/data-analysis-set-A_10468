<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#07111f"/>
    <stop offset=".55" stop-color="#0b1728"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>

  <linearGradient id="cyan" x1="0" x2="1">
    <stop stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>

  <linearGradient id="green" x1="0" x2="1">
    <stop stop-color="#34d399"/>
    <stop offset="1" stop-color="#a3e635"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="10" stdDeviation="14"
      flood-color="#000" flood-opacity=".4"/>
  </filter>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="418" rx="27"
      fill="url(#grid)" opacity=".32"/>

<!-- HEADER ACCENT -->
<rect x="55" y="48" width="46" height="4" rx="2" fill="#22d3ee"/>

<text x="55" y="91"
      font-family="Arial,sans-serif"
      font-size="42"
      font-weight="800"
      fill="#f8fafc">
  SmartRide
</text>

<text x="57" y="126"
      font-family="Arial,sans-serif"
      font-size="23"
      font-weight="700"
      fill="url(#cyan)">
  Data Preprocessing &amp;
</text>

<text x="57" y="156"
      font-family="Arial,sans-serif"
      font-size="23"
      font-weight="700"
      fill="#93c5fd">
  Feature Engineering Pipeline
</text>

<text x="58" y="181"
      font-family="Arial,sans-serif"
      font-size="13"
      fill="#64748b">
  End-to-end ride data preprocessing project
</text>

<!-- LEFT: DATA FLOW CARD -->
<g transform="translate(55 218)" filter="url(#shadow)">

  <rect width="600" height="132"
        rx="20"
        fill="#0b1422"
        stroke="#26364a"/>

  <text x="20" y="25"
        font-family="monospace"
        font-size="9"
        letter-spacing="2"
        fill="#64748b">
    PIPELINE STATUS
  </text>

  <!-- progress rail -->
  <line x1="45" y1="72"
        x2="555" y2="72"
        stroke="#26364a"
        stroke-width="4"/>

  <line x1="45" y1="72"
        x2="555" y2="72"
        stroke="url(#cyan)"
        stroke-width="3"
        stroke-dasharray="20 18">
    <animate attributeName="stroke-dashoffset"
             values="0;-38"
             dur="1s"
             repeatCount="indefinite"/>
  </line>

  <!-- nodes -->
  <g>
    <circle cx="45" cy="72" r="16"
            fill="#071827"
            stroke="#22d3ee"
            stroke-width="2"/>
    <text x="45" y="76"
          text-anchor="middle"
          font-family="monospace"
          font-size="8"
          fill="#67e8f9">01</text>

    <text x="45" y="105"
          text-anchor="middle"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">RAW</text>
  </g>

  <g>
    <circle cx="215" cy="72" r="16"
            fill="#071827"
            stroke="#38bdf8"
            stroke-width="2"/>
    <path d="M207 72L213 78L223 65"
          fill="none"
          stroke="#67e8f9"
          stroke-width="2"/>

    <text x="215" y="105"
          text-anchor="middle"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">CLEAN</text>
  </g>

  <g>
    <circle cx="385" cy="72" r="16"
            fill="#071827"
            stroke="#818cf8"
            stroke-width="2"/>
    <path d="M376 79L383 66L389 73L397 63"
          fill="none"
          stroke="#a5b4fc"
          stroke-width="2"/>

    <text x="385" y="105"
          text-anchor="middle"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">ENGINEER</text>
  </g>

  <g>
    <circle cx="555" cy="72" r="16"
            fill="#071827"
            stroke="#34d399"
            stroke-width="2"/>
    <path d="M547 72L553 78L564 64"
          fill="none"
          stroke="#6ee7b7"
          stroke-width="2"/>

    <text x="555" y="105"
          text-anchor="middle"
          font-family="Arial"
          font-size="9"
          fill="#94a3b8">MODEL READY</text>
  </g>

  <!-- moving packet -->
  <circle r="5"
          fill="#f8fafc"
          filter="url(#glow)">
    <animateMotion
      dur="2.8s"
      repeatCount="indefinite"
      path="M45 72H555"/>
  </circle>

</g>

<!-- RIGHT: ABSTRACT SECURITY / RADAR -->
<g transform="translate(735 47)" filter="url(#shadow)">

  <rect width="410" height="305"
        rx="24"
        fill="#09121f"
        stroke="#26364a"/>

  <text x="24" y="30"
        font-family="monospace"
        font-size="9"
        letter-spacing="2"
        fill="#64748b">
    ANOMALY MONITOR
  </text>

  <text x="24" y="53"
        font-family="Arial"
        font-size="12"
        fill="#cbd5e1">
    Ride signal verification
  </text>

  <!-- radar -->
  <g transform="translate(135 170)">

    <circle r="94"
            fill="#07111d"
            stroke="#26364a"/>

    <circle r="72"
            fill="none"
            stroke="#1e3a4c"/>

    <circle r="49"
            fill="none"
            stroke="#1e3a4c"/>

    <circle r="25"
            fill="none"
            stroke="#164e63"/>

    <path d="M-94 0H94M0 -94V94"
          stroke="#172c3d"
          stroke-width="1"/>

    <!-- sweep cone -->
    <path d="M0 0L0 -94A94 94 0 0 1 67 -67Z"
          fill="#22d3ee"
          opacity=".10">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="3.5s"
        repeatCount="indefinite"/>
    </path>

    <!-- sweep arm -->
    <line x1="0" y1="0"
          x2="0" y2="-94"
          stroke="#22d3ee"
          stroke-width="2"
          filter="url(#glow)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="3.5s"
        repeatCount="indefinite"/>
    </line>

    <!-- target 1 -->
    <circle cx="46" cy="-36" r="4"
            fill="#34d399"
            filter="url(#glow)">
      <animate attributeName="r"
               values="3;7;3"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <!-- target 2 -->
    <circle cx="-54" cy="19" r="4"
            fill="#60a5fa"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.7s"
               repeatCount="indefinite"/>
    </circle>

    <!-- target 3 -->
    <circle cx="20" cy="56" r="4"
            fill="#a3e635"
            filter="url(#glow)">
      <animate attributeName="r"
               values="3;8;3"
               dur="1.9s"
               repeatCount="indefinite"/>
    </circle>

    <!-- center -->
    <circle r="7"
            fill="#22d3ee"
            filter="url(#glow)">
      <animate attributeName="r"
               values="5;9;5"
               dur="1.2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status panel -->
  <g transform="translate(270 90)">
    <rect width="110" height="155"
          rx="15"
          fill="#0d1927"
          stroke="#1e3346"/>

    <text x="15" y="25"
          font-family="monospace"
          font-size="8"
          fill="#64748b">
      SIGNAL
    </text>

    <text x="15" y="48"
          font-family="Arial"
          font-size="18"
          font-weight="700"
          fill="#4ade80">
      NORMAL
    </text>

    <line x1="15" y1="62"
          x2="95" y2="62"
          stroke="#26364a"/>

    <text x="15" y="83"
          font-family="monospace"
          font-size="8"
          fill="#64748b">
      OUTLIERS
    </text>

    <text x="15" y="101"
          font-family="Arial"
          font-size="16"
          font-weight="700"
          fill="#f8fafc">
      0.8%
    </text>

    <text x="15" y="123"
          font-family="monospace"
          font-size="8"
          fill="#64748b">
      QUALITY
    </text>

    <text x="15" y="142"
          font-family="Arial"
          font-size="16"
          font-weight="700"
          fill="#67e8f9">
      99.2%
    </text>
  </g>
</g>

<!-- BOTTOM MINI METRICS -->
<g transform="translate(55 368)"
   font-family="monospace">

  <g>
    <circle cx="5" cy="5" r="4"
            fill="#34d399"
            filter="url(#glow)"/>
    <text x="16" y="9"
          font-size="9"
          fill="#64748b">
      24,812 RECORDS
    </text>
  </g>

  <g transform="translate(155)">
    <circle cx="5" cy="5" r="4"
            fill="#60a5fa"
            filter="url(#glow)"/>
    <text x="16" y="9"
          font-size="9"
          fill="#64748b">
      18 FEATURES
    </text>
  </g>

  <g transform="translate(295)">
    <circle cx="5" cy="5" r="4"
            fill="#a3e635"
            filter="url(#glow)"/>
    <text x="16" y="9"
          font-size="9"
          fill="#64748b">
      VALIDATED
    </text>
  </g>

</g>

<!-- SMALL FLOATING SIGNAL -->
<g transform="translate(680 80)">
  <circle r="19"
          fill="#0d1927"
          stroke="#1e3a4c"/>

  <path d="M-8 0H8M0 -8V8"
        stroke="#22d3ee"
        stroke-width="1"/>

  <circle r="4"
          fill="#22d3ee"
          filter="url(#glow)">
    <animate attributeName="r"
             values="3;7;3"
             dur="1.4s"
             repeatCount="indefinite"/>
  </circle>

  <animateTransform
    attributeName="transform"
    type="translate"
    values="680 80;690 72;680 80"
    dur="3s"
    repeatCount="indefinite"/>
</g>

<!-- subtle bottom line -->
<path d="M55 404H1145"
      stroke="#1e293b"/>

</svg>
