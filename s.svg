<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0c0a09"/>
    <stop offset=".45" stop-color="#1c1917"/>
    <stop offset="1" stop-color="#292524"/>
  </linearGradient>

  <linearGradient id="gold" x1="0" x2="1">
    <stop stop-color="#f59e0b"/>
    <stop offset=".5" stop-color="#fbbf24"/>
    <stop offset="1" stop-color="#fb7185"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="8"
      flood-color="#000" flood-opacity=".5"/>
  </filter>

  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#44403c" stroke-width="1"/>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)" opacity=".35"/>

<!-- WARM GLOW -->
<circle cx="1060" cy="90" r="115"
        fill="#f59e0b" opacity=".08"
        filter="url(#glow)">
  <animate attributeName="r"
    values="90;125;90"
    dur="5s"
    repeatCount="indefinite"/>
</circle>

<!-- LEFT TITLE -->
<text x="62" y="88"
      font-family="Georgia,serif"
      font-size="44"
      font-weight="700"
      fill="#fafaf9">
  SmartRide
</text>

<text x="64" y="128"
      font-family="Arial,sans-serif"
      font-size="24"
      font-weight="800"
      fill="#fbbf24">
  Data Preprocessing &amp;
</text>

<text x="64" y="159"
      font-family="Arial,sans-serif"
      font-size="24"
      font-weight="800"
      fill="#fb7185">
  Feature Engineering Pipeline
</text>

<text x="64" y="187"
      font-family="Arial,sans-serif"
      font-size="14"
      fill="#a8a29e">
  End-to-end ride data preprocessing project
</text>

<!-- LARGE DATA CARD -->
<g transform="translate(60 220)" filter="url(#shadow)">
  <rect width="430" height="140" rx="20"
        fill="#181512"
        stroke="#57534e"/>

  <!-- top bar -->
  <circle cx="24" cy="22" r="5" fill="#ef4444"/>
  <circle cx="42" cy="22" r="5" fill="#eab308"/>
  <circle cx="60" cy="22" r="5" fill="#22c55e"/>

  <text x="85" y="27"
        font-family="monospace"
        font-size="11"
        fill="#78716c">
    smartride_pipeline
  </text>

  <!-- waveform -->
  <polyline
    points="25,83 55,70 85,92 115,52 145,76 175,45 205,65 235,38 265,59 295,30 325,52 355,28 395,45"
    fill="none"
    stroke="url(#gold)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)">
    <animate
      attributeName="stroke-dasharray"
      values="0,500;500,0;0,500"
      dur="5s"
      repeatCount="indefinite"/>
  </polyline>

  <line x1="25" y1="108" x2="395" y2="108"
        stroke="#44403c"/>

  <text x="25" y="128"
        font-family="monospace"
        font-size="10"
        fill="#78716c">
    RAW
  </text>

  <text x="130" y="128"
        font-family="monospace"
        font-size="10"
        fill="#78716c">
    CLEAN
  </text>

  <text x="235" y="128"
        font-family="monospace"
        font-size="10"
        fill="#78716c">
    FEATURES
  </text>

  <text x="345" y="128"
        font-family="monospace"
        font-size="10"
        fill="#78716c">
    READY
  </text>
</g>

<!-- RIGHT PIPELINE -->
<g transform="translate(570 52)">

  <!-- central line -->
  <path d="M55 45V335"
        stroke="#57534e"
        stroke-width="2"/>

  <!-- moving energy -->
  <circle r="6"
          fill="#fbbf24"
          filter="url(#glow)">
    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M55 45V335"/>
  </circle>

  <!-- NODE 1 -->
  <g transform="translate(0 25)">
    <circle cx="55" cy="20" r="20"
            fill="#292524"
            stroke="#f59e0b"
            stroke-width="3"/>

    <text x="55" y="25"
          text-anchor="middle"
          font-family="monospace"
          font-size="11"
          fill="#fbbf24">
      01
    </text>

    <rect x="95" y="-7"
          width="205" height="54"
          rx="14"
          fill="#181512"
          stroke="#44403c"/>

    <text x="115" y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#fafaf9">
      RAW RIDE DATA
    </text>

    <text x="115" y="34"
          font-family="monospace"
          font-size="10"
          fill="#78716c">
      trips • fares • timestamps
    </text>
  </g>

  <!-- NODE 2 -->
  <g transform="translate(0 105)">
    <circle cx="55" cy="20" r="20"
            fill="#292524"
            stroke="#fb7185"
            stroke-width="3"/>

    <path d="M47 20L53 26L65 12"
          fill="none"
          stroke="#fecdd3"
          stroke-width="3"/>

    <rect x="95" y="-7"
          width="205" height="54"
          rx="14"
          fill="#181512"
          stroke="#44403c"/>

    <text x="115" y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#fafaf9">
      DATA CLEANING
    </text>

    <text x="115" y="34"
          font-family="monospace"
          font-size="10"
          fill="#78716c">
      nulls • duplicates • outliers
    </text>
  </g>

  <!-- NODE 3 -->
  <g transform="translate(0 185)">
    <circle cx="55" cy="20" r="20"
            fill="#292524"
            stroke="#fbbf24"
            stroke-width="3"/>

    <polyline points="44,28 51,18 58,23 67,10"
              fill="none"
              stroke="#fef3c7"
              stroke-width="3"/>

    <rect x="95" y="-7"
          width="205" height="54"
          rx="14"
          fill="#181512"
          stroke="#44403c"/>

    <text x="115" y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#fafaf9">
      FEATURE ENGINEERING
    </text>

    <text x="115" y="34"
          font-family="monospace"
          font-size="10"
          fill="#78716c">
      distance • speed • time
    </text>
  </g>

  <!-- NODE 4 -->
  <g transform="translate(0 265)">
    <circle cx="55" cy="20" r="20"
            fill="#292524"
            stroke="#fb7185"
            stroke-width="3"/>

    <text x="55" y="25"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#fecdd3">
      ML
    </text>

    <rect x="95" y="-7"
          width="205" height="54"
          rx="14"
          fill="#181512"
          stroke="#44403c"/>

    <text x="115" y="16"
          font-family="Arial"
          font-size="13"
          font-weight="700"
          fill="#fafaf9">
      MODEL READY
    </text>

    <text x="115" y="34"
          font-family="monospace"
          font-size="10"
          fill="#78716c">
      normalized feature matrix
    </text>
  </g>
</g>

<!-- FLOATING OBJECTS -->
<g filter="url(#shadow)">

  <g transform="translate(930 40)">
    <rect width="145" height="62"
          rx="16"
          fill="#181512"
          stroke="#57534e"/>

    <text x="18" y="22"
          font-family="monospace"
          font-size="9"
          fill="#78716c">
      FEATURE SCORE
    </text>

    <text x="18" y="48"
          font-family="Arial"
          font-size="23"
          font-weight="800"
          fill="#fbbf24">
      98.4%
    </text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="930 40;930 30;930 40"
      dur="3s"
      repeatCount="indefinite"/>
  </g>

  <g transform="translate(930 130)">
    <rect width="145" height="62"
          rx="16"
          fill="#181512"
          stroke="#57534e"/>

    <text x="18" y="22"
          font-family="monospace"
          font-size="9"
          fill="#78716c">
      DATA QUALITY
    </text>

    <text x="18" y="48"
          font-family="Arial"
          font-size="23"
          font-weight="800"
          fill="#4ade80">
      CLEAN
    </text>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="930 130;930 138;930 130"
      dur="3.4s"
      repeatCount="indefinite"/>
  </g>

</g>

<!-- MINI FEATURE PILLS -->
<g font-family="monospace" font-size="10">
  <g transform="translate(930 225)">
    <rect width="86" height="28" rx="14"
          fill="#292524" stroke="#f59e0b"/>
    <text x="43" y="18"
          text-anchor="middle"
          fill="#fbbf24">DISTANCE</text>
  </g>

  <g transform="translate(1025 225)">
    <rect width="65" height="28" rx="14"
          fill="#292524" stroke="#fb7185"/>
    <text x="32" y="18"
          text-anchor="middle"
          fill="#fecdd3">FARE</text>
  </g>

  <g transform="translate(930 265)">
    <rect width="86" height="28" rx="14"
          fill="#292524" stroke="#22c55e"/>
    <text x="43" y="18"
          text-anchor="middle"
          fill="#86efac">SPEED</text>
  </g>

  <g transform="translate(1025 265)">
    <rect width="65" height="28" rx="14"
          fill="#292524" stroke="#f59e0b"/>
    <text x="32" y="18"
          text-anchor="middle"
          fill="#fbbf24">TIME</text>
  </g>
</g>

<!-- ROAD -->
<path d="M0 390H1200"
      stroke="#0c0a09"
      stroke-width="28"/>

<path d="M0 390H1200"
      stroke="#78716c"
      stroke-width="2"
      stroke-dasharray="38 30">
  <animate attributeName="stroke-dashoffset"
           values="0;-68"
           dur="1s"
           repeatCount="indefinite"/>
</path>

<!-- MOVING CAR -->
<g transform="translate(-150 370)">
  <g>
    <rect x="5" y="12"
          width="100"
          height="27"
          rx="10"
          fill="url(#gold)"/>

    <path d="M20 12L34 -2H72L91 12Z"
          fill="#fbbf24"/>

    <path d="M39 1H70L81 12H29Z"
          fill="#292524"/>

    <circle cx="27" cy="42" r="9"
            fill="#09090b"/>

    <circle cx="84" cy="42" r="9"
            fill="#09090b"/>

    <circle cx="27" cy="42" r="3"
            fill="#a8a29e"/>

    <circle cx="84" cy="42" r="3"
            fill="#a8a29e"/>

    <rect x="97" y="19"
          width="7" height="7"
          rx="2"
          fill="#fff7ed"
          filter="url(#glow)"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-150 370;1230 370"
      dur="8s"
      repeatCount="indefinite"/>
  </g>
</g>

<!-- DATA PARTICLES -->
<g fill="#fbbf24" filter="url(#glow)">
  <circle cx="510" cy="70" r="3">
    <animate attributeName="cy"
      values="70;50;70"
      dur="2.5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="330" r="3">
    <animate attributeName="cy"
      values="330;310;330"
      dur="2.2s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1120" cy="340" r="2">
    <animate attributeName="opacity"
      values=".2;1;.2"
      dur="1.7s"
      repeatCount="indefinite"/>
  </circle>
</g>

</svg>
