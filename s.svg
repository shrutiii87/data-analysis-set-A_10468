<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#06141f"/><stop offset=".55" stop-color="#092b3a"/><stop offset="1" stop-color="#031018"/>
  </linearGradient>
  <linearGradient id="n"><stop stop-color="#2dd4bf"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bg"><feGaussianBlur stdDeviation="25"/></filter>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#b)"/>

<!-- ambient lights -->
<circle cx="1050" cy="75" r="90" fill="#22d3ee" opacity=".08" filter="url(#bg)">
  <animate attributeName="cx" values="1050;970;1050" dur="6s" repeatCount="indefinite"/>
</circle>
<circle cx="160" cy="350" r="80" fill="#2dd4bf" opacity=".07" filter="url(#bg)">
  <animate attributeName="cy" values="350;315;350" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- decorative circuit -->
<g fill="none" stroke="#155e75" stroke-width="1">
  <path d="M0 70H270V35H360"/>
  <path d="M0 100H220"/>
  <path d="M930 350H1200"/>
  <path d="M1010 0V45H1160V120"/>
</g>

<g fill="#22d3ee">
  <circle cx="270" cy="70" r="3"/>
  <circle cx="360" cy="35" r="3"/>
  <circle cx="1010" cy="45" r="3"/>
  <circle cx="1160" cy="120" r="3"/>
</g>

<!-- title -->
<text x="65" y="100" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#f8fafc">SmartRide</text>
<text x="65" y="140" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#5eead4">Data Preprocessing &amp;</text>
<text x="65" y="172" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#67e8f9">Feature Engineering Pipeline</text>
<text x="65" y="201" font-family="Arial,sans-serif" font-size="14" fill="#94a3b8">End-to-end ride data preprocessing project</text>

<!-- central pipeline -->
<g transform="translate(65 245)">
  <!-- raw -->
  <g>
    <rect width="105" height="58" rx="15" fill="#082f49" stroke="#22d3ee"/>
    <circle cx="25" cy="29" r="13" fill="#0e7490"/>
    <path d="M18 25h14M18 30h14M18 35h10" stroke="#cffafe" stroke-width="2"/>
    <text x="48" y="34" font-family="Arial" font-size="13" fill="white">RAW DATA</text>
  </g>

  <!-- connector -->
  <path d="M105 29H145" stroke="#22d3ee" stroke-width="3"/>
  <circle r="4" fill="#5eead4" filter="url(#g)">
    <animateMotion dur="1.4s" repeatCount="indefinite" path="M105 29H145"/>
  </circle>

  <!-- clean -->
  <g transform="translate(145)">
    <rect width="120" height="58" rx="15" fill="#082f49" stroke="#2dd4bf"/>
    <circle cx="25" cy="29" r="13" fill="#0f766e"/>
    <path d="M18 30l6 6 11-14" fill="none" stroke="#ccfbf1" stroke-width="3"/>
    <text x="48" y="34" font-family="Arial" font-size="13" fill="white">CLEANING</text>
  </g>

  <path d="M265 29H305" stroke="#2dd4bf" stroke-width="3"/>
  <circle r="4" fill="#5eead4" filter="url(#g)">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M265 29H305"/>
  </circle>

  <!-- transform -->
  <g transform="translate(305)">
    <rect width="145" height="58" rx="15" fill="#092f3d" stroke="#60a5fa"/>
    <circle cx="25" cy="29" r="13" fill="#1d4ed8"/>
    <path d="M17 35l7-12 7 8 6-12" fill="none" stroke="#dbeafe" stroke-width="2"/>
    <text x="48" y="34" font-family="Arial" font-size="13" fill="white">FEATURES</text>
  </g>

  <path d="M450 29H490" stroke="#60a5fa" stroke-width="3"/>
  <circle r="4" fill="#93c5fd" filter="url(#g)">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M450 29H490"/>
  </circle>

  <!-- output -->
  <g transform="translate(490)">
    <rect width="125" height="58" rx="15" fill="#092f3d" stroke="#5eead4"/>
    <circle cx="25" cy="29" r="13" fill="#047857"/>
    <path d="M18 29l5 5 11-12" fill="none" stroke="#d1fae5" stroke-width="3"/>
    <text x="48" y="34" font-family="Arial" font-size="13" fill="white">MODEL READY</text>
  </g>
</g>

<!-- right visualization -->
<g transform="translate(810 55)">
  <rect width="315" height="185" rx="22" fill="#061923" stroke="#164e63"/>

  <text x="25" y="30" font-family="Arial" font-size="11" letter-spacing="2" fill="#64748b">RIDE SIGNAL</text>

  <!-- graph -->
  <path d="M25 145H285M25 110H285M25 75H285M25 40H285"
        stroke="#123646" stroke-width="1"/>

  <polyline points="25,137 62,120 95,128 130,83 165,103 198,55 232,76 285,38"
            fill="none" stroke="url(#n)" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#g)">
    <animate attributeName="stroke-dasharray"
             values="0,500;500,0;0,500"
             dur="5s" repeatCount="indefinite"/>
  </polyline>

  <circle cx="285" cy="38" r="5" fill="#2dd4bf" filter="url(#g)">
    <animate attributeName="r" values="4;8;4" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- moving scan -->
  <rect x="25" y="38" width="2" height="107" fill="#22d3ee" opacity=".8">
    <animate attributeName="x" values="25;285;25" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- floating data chips -->
<g font-family="Arial" font-size="11">
  <g transform="translate(820 265)">
    <rect width="82" height="30" rx="15" fill="#083344" stroke="#22d3ee"/>
    <text x="41" y="20" text-anchor="middle" fill="#a5f3fc">DISTANCE</text>
    <animateTransform attributeName="transform" type="translate"
      values="820 265;820 258;820 265" dur="2.5s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(915 265)">
    <rect width="70" height="30" rx="15" fill="#064e3b" stroke="#2dd4bf"/>
    <text x="35" y="20" text-anchor="middle" fill="#a7f3d0">FARE</text>
    <animateTransform attributeName="transform" type="translate"
      values="915 265;915 272;915 265" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(998 265)">
    <rect width="85" height="30" rx="15" fill="#172554" stroke="#60a5fa"/>
    <text x="42" y="20" text-anchor="middle" fill="#bfdbfe">DURATION</text>
    <animateTransform attributeName="transform" type="translate"
      values="998 265;998 258;998 265" dur="2.8s" repeatCount="indefinite"/>
  </g>
</g>

<!-- road -->
<path d="M0 365H1200" stroke="#0f172a" stroke-width="42"/>
<path d="M0 365H1200" stroke="#334155" stroke-width="2" stroke-dasharray="50 35">
  <animate attributeName="stroke-dashoffset" values="0;-85" dur="1s" repeatCount="indefinite"/>
</path>

<!-- moving car -->
<g>
  <g transform="translate(-150 335)">
    <path d="M12 30L29 9Q34 3 45 3H79Q88 3 96 12L108 30Z" fill="#2563eb"/>
    <rect x="3" y="26" width="110" height="30" rx="11" fill="#3b82f6"/>
    <path d="M37 9H78L88 26H28Z" fill="#082f49" stroke="#38bdf8"/>
    <circle cx="27" cy="58" r="10" fill="#020617"/>
    <circle cx="91" cy="58" r="10" fill="#020617"/>
    <circle cx="27" cy="58" r="3" fill="#64748b"/>
    <circle cx="91" cy="58" r="3" fill="#64748b"/>
    <path d="M104 35h7" stroke="#fef08a" stroke-width="5" filter="url(#g)"/>
    <animateTransform attributeName="transform" type="translate"
      values="-150 335;1230 335" dur="8s" repeatCount="indefinite"/>
  </g>
</g>

<!-- particles -->
<g fill="#5eead4" filter="url(#g)">
  <circle cx="730" cy="85" r="3">
    <animate attributeName="cy" values="85;65;85" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="130" r="2">
    <animate attributeName="cy" values="130;150;130" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1125" cy="320" r="3">
    <animate attributeName="cy" values="320;300;320" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</g>

</svg>
