<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#100d18"/>
    <stop offset=".5" stop-color="#17121f"/>
    <stop offset="1" stop-color="#0b1015"/>
  </linearGradient>

  <linearGradient id="coral" x1="0" x2="1">
    <stop stop-color="#fb7185"/>
    <stop offset="1" stop-color="#f97316"/>
  </linearGradient>

  <linearGradient id="violet" x1="0" x2="1">
    <stop stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#e879f9"/>
  </linearGradient>

  <linearGradient id="lime" x1="0" x2="1">
    <stop stop-color="#bef264"/>
    <stop offset="1" stop-color="#4ade80"/>
  </linearGradient>

  <radialGradient id="orb">
    <stop stop-color="#39204b"/>
    <stop offset=".55" stop-color="#20152c"/>
    <stop offset="1" stop-color="#100d18"/>
  </radialGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="blur">
    <feGaussianBlur stdDeviation="30"/>
  </filter>

  <pattern id="micro" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r=".8" fill="#76647d"/>
  </pattern>
</defs>

<!-- BACKGROUND -->
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect x="30" y="30" width="1140" height="360" rx="22"
      fill="url(#micro)" opacity=".15"/>

<circle cx="940" cy="200" r="170"
        fill="#e879f9" opacity=".045" filter="url(#blur)">
  <animate attributeName="r"
           values="140;185;140"
           dur="7s"
           repeatCount="indefinite"/>
</circle>

<!-- HEADER / LEFT -->
<g transform="translate(58 52)">
  <rect width="48" height="3" rx="2" fill="url(#coral)"/>

  <text x="0" y="39"
        font-family="Arial,sans-serif"
        font-size="39"
        font-weight="800"
        fill="#faf7fb">
    SmartRide
  </text>

  <text x="0" y="70"
        font-family="Arial,sans-serif"
        font-size="18"
        font-weight="600"
        fill="#fda4af">
    Data Preprocessing &amp; Feature Engineering
  </text>

  <text x="1" y="94"
        font-family="Arial,sans-serif"
        font-size="11"
        fill="#887c91">
    End-to-end ride data preprocessing project
  </text>
</g>

<!-- LEFT: THREE CLEAN MODULES -->
<g transform="translate(58 190)">

  <!-- module 1 -->
  <g>
    <rect width="174" height="124"
          rx="16"
          fill="#15111c"
          stroke="#382c42"/>

    <circle cx="28" cy="28" r="10"
            fill="#27151d"
            stroke="#fb7185"/>

    <text x="48" y="32"
          font-family="monospace"
          font-size="8"
          fill="#84758c">
      INGEST
    </text>

    <text x="20" y="69"
          font-family="Arial"
          font-size="25"
          font-weight="800"
          fill="#f5eaf2">
      24.8K
    </text>

    <text x="20" y="91"
          font-family="monospace"
          font-size="8"
          fill="#766b7d">
      RIDE RECORDS
    </text>

    <path d="M20 108H154"
          stroke="#2d2533"/>

    <circle cx="20" cy="108" r="2.5"
            fill="#fb7185">
      <animate attributeName="cx"
               values="20;154;20"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- module 2 -->
  <g transform="translate(192)">
    <rect width="174" height="124"
          rx="16"
          fill="#14131b"
          stroke="#382f43"/>

    <circle cx="28" cy="28" r="10"
            fill="#1b2020"
            stroke="#4ade80"/>

    <path d="M23 28L27 32L34 23"
          fill="none"
          stroke="#86efac"
          stroke-width="2"/>

    <text x="48" y="32"
          font-family="monospace"
          font-size="8"
          fill="#84758c">
      CLEAN
    </text>

    <text x="20" y="69"
          font-family="Arial"
          font-size="25"
          font-weight="800"
          fill="#dcfce7">
      99.2%
    </text>

    <text x="20" y="91"
          font-family="monospace"
          font-size="8"
          fill="#766b7d">
      VALIDATED
    </text>

    <path d="M20 108H154"
          stroke="#2d2533"/>

    <path d="M20 108L60 108L80 101L110 108L154 108"
          fill="none"
          stroke="#4ade80"
          stroke-width="1.5"/>
  </g>

  <!-- module 3 -->
  <g transform="translate(384)">
    <rect width="174" height="124"
          rx="16"
          fill="#16121c"
          stroke="#382c42"/>

    <circle cx="28" cy="28" r="10"
            fill="#20172b"
            stroke="#c084fc"/>

    <path d="M22 33L28 22L33 27L38 20"
          fill="none"
          stroke="#d8b4fe"
          stroke-width="1.8"/>

    <text x="48" y="32"
          font-family="monospace"
          font-size="8"
          fill="#84758c">
      ENGINEER
    </text>

    <text x="20" y="69"
          font-family="Arial"
          font-size="25"
          font-weight="800"
          fill="#f3e8ff">
      18
    </text>

    <text x="20" y="91"
          font-family="monospace"
          font-size="8"
          fill="#766b7d">
      FEATURES
    </text>

    <!-- animated mini waveform -->
    <path d="M20 108L43 108L54 99L67 114L82 103L96 108L110 97L125 112L139 103L154 108"
          fill="none"
          stroke="#c084fc"
          stroke-width="1.5"
          stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset"
               values="0;-36"
               dur="1s"
               repeatCount="indefinite"/>
    </path>
  </g>
</g>

<!-- CENTER DIVIDER -->
<line x1="650" y1="55"
      x2="650" y2="360"
      stroke="#2a2230"/>

<!-- RIGHT: ABSTRACT FLOATING HOLOGRAPHIC RIBBON -->
<g transform="translate(920 210)">

  <!-- large soft ring -->
  <circle r="144"
          fill="none"
          stroke="#2c2235"
          stroke-width="1"/>

  <circle r="111"
          fill="none"
          stroke="#392942"
          stroke-width="1"
          stroke-dasharray="2 10">
    <animate attributeName="stroke-dashoffset"
             values="0;-48"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>

  <!-- sweeping orbital ribbons -->
  <ellipse rx="145" ry="67"
           fill="none"
           stroke="url(#violet)"
           stroke-width="2"
           opacity=".75"
           transform="rotate(-24)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="-24" to="336"
      dur="9s"
      repeatCount="indefinite"/>
  </ellipse>

  <ellipse rx="145" ry="67"
           fill="none"
           stroke="url(#coral)"
           stroke-width="2"
           opacity=".8"
           stroke-dasharray="8 15"
           transform="rotate(24)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="24" to="-336"
      dur="7s"
      repeatCount="indefinite"/>
  </ellipse>

  <!-- orbital data beads -->
  <g>
    <circle cx="145" cy="0" r="5"
            fill="#fb7185"
            filter="url(#glow)"/>
    <circle cx="-145" cy="0" r="4"
            fill="#a78bfa"
            filter="url(#glow)"/>
    <circle cx="0" cy="-67" r="4"
            fill="#bef264"
            filter="url(#glow)"/>

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0" to="360"
      dur="6s"
      repeatCount="indefinite"/>
  </g>

  <!-- floating 3D prism -->
  <g>

    <!-- shadow -->
    <ellipse cx="0" cy="105"
             rx="78" ry="17"
             fill="#000"
             opacity=".5"
             filter="url(#blur)"/>

    <!-- prism top -->
    <path d="M0-82L70-41L0 0L-70-41Z"
          fill="#261a2d"
          stroke="#8b5cf6"
          stroke-width="2"/>

    <!-- prism left -->
    <path d="M-70-41L0 0V82L-70 41Z"
          fill="#15131b"
          stroke="#493a53"
          stroke-width="1.5"/>

    <!-- prism right -->
    <path d="M70-41L0 0V82L70 41Z"
          fill="#211720"
          stroke="#5c3948"
          stroke-width="1.5"/>

    <!-- internal core -->
    <path d="M0-43L37-22V22L0 43L-37 22V-22Z"
          fill="url(#orb)"
          stroke="url(#coral)"
          stroke-width="2"/>

    <!-- data lattice -->
    <path d="M-24-13L-7-25L11-15L26-24"
          fill="none"
          stroke="#fda4af"
          stroke-width="2"/>

    <path d="M-25 7L-8-3L10 7L26-3"
          fill="none"
          stroke="#c4b5fd"
          stroke-width="2"/>

    <path d="M-22 25L-7 16L9 25L24 16"
          fill="none"
          stroke="#bef264"
          stroke-width="2"/>

    <!-- animated data nodes -->
    <g filter="url(#glow)">
      <circle cx="-7" cy="-25" r="3"
              fill="#fb7185">
        <animate attributeName="r"
                 values="2;7;2"
                 dur="1.5s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="10" cy="7" r="3"
              fill="#c084fc">
        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="1.7s"
                 repeatCount="indefinite"/>
      </circle>

      <circle cx="-7" cy="16" r="3"
              fill="#a3e635">
        <animate attributeName="r"
                 values="2;6;2"
                 dur="1.9s"
                 repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- core -->
    <circle r="10"
            fill="#130f18"
            stroke="#fda4af"
            stroke-width="2"
            filter="url(#glow)">
      <animate attributeName="r"
               values="8;14;8"
               dur="1.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle r="3" fill="#fff1f2"/>

    <!-- floating -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -8;0 0"
      dur="4s"
      repeatCount="indefinite"/>
  </g>

  <!-- particles -->
  <g filter="url(#glow)">
    <circle cx="-115" cy="-64" r="3"
            fill="#bef264">
      <animate attributeName="cy"
               values="-64;-74;-64"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="112" cy="68" r="3"
            fill="#fb7185">
      <animate attributeName="cy"
               values="68;58;68"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <rect x="86" y="-91"
          width="6" height="6"
          rx="2"
          fill="#c084fc">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0" to="360"
        dur="3s"
        repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom badge -->
  <g transform="translate(-78 164)">
    <rect width="156" height="28"
          rx="14"
          fill="#151119"
          stroke="#3b2d43"/>

    <circle cx="17" cy="14" r="3.5"
            fill="#4ade80">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1.3s"
               repeatCount="indefinite"/>
    </circle>

    <text x="30" y="18"
          font-family="monospace"
          font-size="8"
          fill="#96899b">
      MODEL READY
    </text>
  </g>
</g>

<!-- BOTTOM LEFT STATUS -->
<g transform="translate(58 354)"
   font-family="monospace">

  <text x="0" y="0"
        font-size="8"
        fill="#69616e">
    DISTANCE
  </text>
  <text x="0" y="16"
        font-size="12"
        fill="#ddd6e0">
    18.42 km
  </text>

  <text x="125" y="0"
        font-size="8"
        fill="#69616e">
    FARE
  </text>
  <text x="125" y="16"
        font-size="12"
        fill="#ddd6e0">
    ₹248
  </text>

  <text x="225" y="0"
        font-size="8"
        fill="#69616e">
    DURATION
  </text>
  <text x="225" y="16"
        font-size="12"
        fill="#ddd6e0">
    32.6 min
  </text>

  <text x="350" y="0"
        font-size="8"
        fill="#69616e">
    STATUS
  </text>
  <text x="350" y="16"
        font-size="12"
        fill="#86efac">
    READY
  </text>
</g>

<!-- corners -->
<path d="M48 350V376H74"
      fill="none"
      stroke="#352b3b"/>

<path d="M1152 350V376H1126"
      fill="none"
      stroke="#352b3b"/>

<circle cx="1142" cy="58" r="4"
        fill="#4ade80"
        filter="url(#glow)">
  <animate attributeName="opacity"
           values=".2;1;.2"
           dur="1.5s"
           repeatCount="indefinite"/>
</circle>

</svg>
